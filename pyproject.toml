[project]
name = "paperader"
version = "2.0.0"
description = "AI-powered research paper management platform - collect, organize, search, and analyze academic papers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "litellm>=1.50",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1", "cryptography>=42.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
paperader = "paperader.cli:app"

[project.urls]
Homepage = "https://github.com/PolarSnowLeopard/PaperRader"
Repository = "https://github.com/PolarSnowLeopard/PaperRader"
Issues = "https://github.com/PolarSnowLeopard/PaperRader/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
